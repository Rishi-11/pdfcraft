
name: Update PdfCraft from upstream release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pdfcraft-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Check latest upstream release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://api.github.com/repos/storytold/pdfcraft/releases/latest \
            -o release.json

          TAG=$(jq -er '.tag_name' release.json)
          PREVIOUS=$(cat .upstream-release 2>/dev/null || true)

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$TAG" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already deployed: $TAG"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New release detected: $TAG"
          fi

      - name: Download and validate web release
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://api.github.com/repos/storytold/pdfcraft/releases/tags/$TAG" \
            -o release.json

          ASSET_URL=$(jq -er '
            [.assets[]
             | select(.name | test("^pdfcraft-web-[0-9][^/]*\\.zip$"; "i"))]
            | first
            | .browser_download_url
          ' release.json)

          mkdir -p site
          curl -fL --retry 3 "$ASSET_URL" -o web.zip

          # Reject an invalid or empty ZIP.
          unzip -tq web.zip
          unzip -q web.zip -d site

          # Find the application entry point.
          if [ ! -f site/index.html ]; then
            INDEX=$(find site -type f -name index.html -print -quit)

            if [ -z "$INDEX" ]; then
              echo "::error::Web ZIP does not contain index.html"
              exit 1
            fi

            ROOT="${INDEX%/index.html}"
            if [ "$ROOT" != "site" ]; then
              cp -a "$ROOT"/. site/
            fi
          fi

          # Check for expected browser assets.
          echo "=== Deployed file inventory ==="
          find site -type f | head -100

          echo "=== WASM and JavaScript assets ==="
          find site -type f \
            \( -name '*.wasm' -o -name '*.js' -o -name '*.mjs' \) \
            -print | head -100

          echo "=== OCR/model-related files ==="
          if ! find site -type f \
            | grep -Ei 'ocr|model|onnx|traineddata'; then
            echo "No files with obvious OCR/model names found."
          fi

          # Prevent GitHub Pages from applying Jekyll processing.
          touch site/.nojekyll

          # Basic deployment sanity checks.
          test -s site/index.html
          test "$(du -sm site | cut -f1)" -gt 0

          echo "Validated release: $TAG"
          echo "Website size:"
          du -sh site

      - name: Configure GitHub Pages
        if: steps.release.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.release.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        if: steps.release.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      - name: Record deployed version
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "$TAG" > .upstream-release
          git add .upstream-release

          if ! git diff --cached --quiet; then
            git commit -m "Record deployed PdfCraft release $TAG"
            git push origin HEAD
          fi
